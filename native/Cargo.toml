[package]
name = "qrtb-native"
version = "0.1.0"
edition = "2021"

[dependencies]
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
zeroize = "1.7"
rayon = "1.10"

[[bin]]
name = "bench_tps"
path = "src/bench_tps.rs"

[build-dependencies]
cc = "1.0"

[[bench]]
name = "crypto_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
